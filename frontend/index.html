<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIGHTS OUT | Official Formula 1 Knowledge & Minigames Hub</title>
  <meta name="description" content="Plataforma de competición de Fórmula 1: Quiz Master con IA local sin repeticiones, Driverle, GeoGuessr, economía de PitCoins y clasificación global.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏁</text></svg>">
  <!-- Leaflet Map CSS & JS (Georreferenced Real World Map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>

  <!-- Top Racing Navigation Bar -->
  <header class="app-nav">
    <div class="brand-container" id="nav-brand-btn">
      <div class="f1-lights-logo">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="brand-title">
        LIGHTS OUT <span class="badge-f1">F1 PLATFORM</span>
      </div>
    </div>

    <nav>
      <ul class="nav-menu">
        <li><button class="nav-btn active" id="tab-home">🏎️ Paddock</button></li>
        <li><button class="nav-btn" id="tab-quiz">⚡ F1 Quiz AI</button></li>
        <li><button class="nav-btn" id="tab-driverle">🕵️ Driverle</button></li>
        <li><button class="nav-btn" id="tab-geoguessr">🗺️ GeoGuessr</button></li>
        <li><button class="nav-btn" id="tab-leaderboard">🏆 Clasificación</button></li>
        <li><a href="https://discord.gg" target="_blank" rel="noopener noreferrer" class="nav-btn" id="tab-discord" style="text-decoration: none; color: #5865F2;">👾 Discord F1</a></li>
        <li><button class="nav-btn" id="tab-paddock-store">🛍️ Tienda</button></li>
        <li><button class="nav-btn" id="tab-profile">👤 Perfil</button></li>
        <li><button class="nav-btn" id="tab-admin" style="color: #c084fc;">⚙️ Admin</button></li>
      </ul>
    </nav>

    <!-- User Live Telemetry Chip -->
    <div class="user-telemetry-badge" id="telemetry-bar-btn" style="cursor: pointer;">
      <div class="coin-chip">
        <span>🪙</span> <span id="nav-user-coins">750</span>
      </div>
      <div class="rank-chip" id="nav-user-rank">
        <span id="nav-rank-icon">🌱</span> <span id="nav-rank-name">Rookie</span>
      </div>
      <div class="avatar-preview-mini" id="nav-avatar-circle">
        <span id="nav-avatar-fallback">🐂</span>
      </div>
    </div>
  </header>

  <!-- Main Viewport Target -->
  <main class="main-viewport" id="app-root">
    <!-- Dynamic Views will be injected here via app.js -->
  </main>

  <!-- Interactive Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Main Application Script -->
  <script type="module" src="app.js?v=2"></script>
</body>
</html>
