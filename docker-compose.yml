services:
  postgres:
    image: postgres:16-alpine
    container_name: lightsout_db
    restart: always
    environment:
      POSTGRES_USER: f1_admin
      POSTGRES_PASSWORD: f1_secure_password_2026
      POSTGRES_DB: lights_out_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: lightsout_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: lightsout_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://f1_admin:f1_secure_password_2026@postgres:5432/lights_out_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: f1_lights_out_secret_production_key_2026
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads

  frontend:
    image: nginx:alpine
    container_name: lightsout_frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
